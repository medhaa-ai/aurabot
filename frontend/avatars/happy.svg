<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <!-- Smiling eyes clip slightly lower to show squint -->
    <clipPath id="eye-l-clip"><ellipse cx="80" cy="102" rx="10" ry="9"/></clipPath>
    <clipPath id="eye-r-clip"><ellipse cx="120" cy="102" rx="10" ry="9"/></clipPath>
  </defs>

  <!-- Hair back -->
  <ellipse cx="100" cy="86" rx="60" ry="76" fill="#1C0D05"/>
  <path d="M 42,100 C 30,125 26,152 32,178 C 36,196 48,216 62,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 158,100 C 170,125 174,152 168,178 C 164,196 152,216 138,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <ellipse cx="100" cy="110" rx="52" ry="62" fill="#C8956C"/>

  <!-- Enhanced blush for happy -->
  <ellipse cx="70" cy="124" rx="16" ry="9" fill="#E8A898" opacity="0.6"/>
  <ellipse cx="130" cy="124" rx="16" ry="9" fill="#E8A898" opacity="0.6"/>

  <!-- Left eye — squinting from smile (reduced height) -->
  <ellipse cx="80" cy="101" rx="10" ry="9" fill="white"/>
  <g clip-path="url(#eye-l-clip)">
    <ellipse cx="81" cy="102" rx="7" ry="7" fill="#4A2410"/>
    <ellipse cx="82" cy="101" rx="4" ry="4" fill="#1A0800"/>
    <ellipse cx="83.5" cy="99.5" rx="1.5" ry="1.5" fill="white"/>
  </g>
  <!-- Happy eye bottom curve (smile crinkle) -->
  <path d="M 70,108 Q 80,114 90,108" stroke="#B07050" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Right eye — squinting -->
  <ellipse cx="120" cy="101" rx="10" ry="9" fill="white"/>
  <g clip-path="url(#eye-r-clip)">
    <ellipse cx="121" cy="102" rx="7" ry="7" fill="#4A2410"/>
    <ellipse cx="122" cy="101" rx="4" ry="4" fill="#1A0800"/>
    <ellipse cx="123.5" cy="99.5" rx="1.5" ry="1.5" fill="white"/>
  </g>
  <path d="M 110,108 Q 120,114 130,108" stroke="#B07050" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows — raised high -->
  <path d="M 70,82 Q 80,77 90,80" stroke="#1C0D05" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M 110,80 Q 120,77 130,82" stroke="#1C0D05" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="95" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>
  <ellipse cx="105" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>

  <!-- Mouth — wide smile -->
  <path d="M 82,131 Q 100,148 118,131" stroke="#C4706A" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="88" y="168" width="24" height="30" rx="4" fill="#C8956C"/>

  <!-- White shirt -->
  <path d="M 65,196 L 100,216 L 135,196 L 150,260 L 50,260 Z" fill="#F5F5F5"/>

  <!-- Left blazer -->
  <path d="M 10,240 L 58,196 L 65,196 L 100,216 L 82,260 L 10,260 Z" fill="#A7C7E7"/>
  <!-- Right blazer -->
  <path d="M 190,240 L 142,196 L 135,196 L 100,216 L 118,260 L 190,260 Z" fill="#A7C7E7"/>

  <!-- Lapels -->
  <path d="M 65,196 L 100,218 L 100,209 L 82,193 Z" fill="#D6E8F5"/>
  <path d="M 135,196 L 100,218 L 100,209 L 118,193 Z" fill="#D6E8F5"/>
</svg>
