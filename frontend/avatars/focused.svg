<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <!-- Narrowed eye clips -->
    <clipPath id="eye-l-clip"><ellipse cx="80" cy="100" rx="10" ry="8"/></clipPath>
    <clipPath id="eye-r-clip"><ellipse cx="120" cy="100" rx="10" ry="8"/></clipPath>
  </defs>

  <!-- Hair back -->
  <ellipse cx="100" cy="86" rx="60" ry="76" fill="#1C0D05"/>
  <path d="M 42,100 C 30,125 26,152 32,178 C 36,196 48,216 62,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 158,100 C 170,125 174,152 168,178 C 164,196 152,216 138,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <ellipse cx="100" cy="110" rx="52" ry="62" fill="#C8956C"/>

  <!-- Minimal blush -->
  <ellipse cx="72" cy="124" rx="13" ry="7" fill="#E8A898" opacity="0.25"/>
  <ellipse cx="128" cy="124" rx="13" ry="7" fill="#E8A898" opacity="0.25"/>

  <!-- Left eye — narrowed -->
  <ellipse cx="80" cy="100" rx="10" ry="8" fill="white"/>
  <g clip-path="url(#eye-l-clip)">
    <ellipse cx="81" cy="101" rx="6.5" ry="6" fill="#4A2410"/>
    <ellipse cx="82" cy="100" rx="3.8" ry="3.5" fill="#1A0800"/>
    <ellipse cx="83.5" cy="98.5" rx="1.3" ry="1.3" fill="white"/>
  </g>

  <!-- Right eye — narrowed -->
  <ellipse cx="120" cy="100" rx="10" ry="8" fill="white"/>
  <g clip-path="url(#eye-r-clip)">
    <ellipse cx="121" cy="101" rx="6.5" ry="6" fill="#4A2410"/>
    <ellipse cx="122" cy="100" rx="3.8" ry="3.5" fill="#1A0800"/>
    <ellipse cx="123.5" cy="98.5" rx="1.3" ry="1.3" fill="white"/>
  </g>

  <!-- Eyebrows — lowered and slightly closer (determined) -->
  <path d="M 71,88 Q 80,85 89,88" stroke="#1C0D05" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M 111,88 Q 120,85 129,88" stroke="#1C0D05" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="95" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>
  <ellipse cx="105" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>

  <!-- Mouth — neutral firm line -->
  <path d="M 87,134 Q 100,136 113,134" stroke="#C4706A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="88" y="168" width="24" height="30" rx="4" fill="#C8956C"/>

  <!-- White shirt -->
  <path d="M 65,196 L 100,216 L 135,196 L 150,260 L 50,260 Z" fill="#F5F5F5"/>

  <!-- Blazer -->
  <path d="M 10,240 L 58,196 L 65,196 L 100,216 L 82,260 L 10,260 Z" fill="#A7C7E7"/>
  <path d="M 190,240 L 142,196 L 135,196 L 100,216 L 118,260 L 190,260 Z" fill="#A7C7E7"/>

  <!-- Lapels -->
  <path d="M 65,196 L 100,218 L 100,209 L 82,193 Z" fill="#D6E8F5"/>
  <path d="M 135,196 L 100,218 L 100,209 L 118,193 Z" fill="#D6E8F5"/>
</svg>
