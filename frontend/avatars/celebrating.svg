<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <clipPath id="eye-l-clip"><ellipse cx="80" cy="102" rx="10" ry="8"/></clipPath>
    <clipPath id="eye-r-clip"><ellipse cx="120" cy="102" rx="10" ry="8"/></clipPath>
    <style>
      .sparkle { animation: sparkle-spin 1.5s ease-in-out infinite alternate; transform-origin: center; }
      @keyframes sparkle-spin {
        0%   { opacity: 0.6; transform: scale(0.8) rotate(0deg); }
        100% { opacity: 1;   transform: scale(1.2) rotate(30deg); }
      }
    </style>
  </defs>

  <!-- Sparkles around the head -->
  <g class="sparkle">
    <polygon points="25,50 27,44 29,50 35,52 29,54 27,60 25,54 19,52" fill="#FFD700" opacity="0.9"/>
    <polygon points="170,38 172,32 174,38 180,40 174,42 172,48 170,42 164,40" fill="#FFD700" opacity="0.9"/>
    <polygon points="155,70 157,65 159,70 164,72 159,74 157,79 155,74 150,72" fill="#A7C7E7" opacity="0.9"/>
    <polygon points="38,75 40,70 42,75 47,77 42,79 40,84 38,79 33,77" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- Hair back -->
  <ellipse cx="100" cy="86" rx="60" ry="76" fill="#1C0D05"/>
  <path d="M 42,100 C 30,125 26,152 32,178 C 36,196 48,216 62,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 158,100 C 170,125 174,152 168,178 C 164,196 152,216 138,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <ellipse cx="100" cy="110" rx="52" ry="62" fill="#C8956C"/>

  <!-- Max blush -->
  <ellipse cx="67" cy="122" rx="18" ry="10" fill="#E8A898" opacity="0.7"/>
  <ellipse cx="133" cy="122" rx="18" ry="10" fill="#E8A898" opacity="0.7"/>

  <!-- Left eye — happy squint -->
  <ellipse cx="80" cy="101" rx="10" ry="8" fill="white"/>
  <g clip-path="url(#eye-l-clip)">
    <ellipse cx="81" cy="103" rx="7" ry="6" fill="#4A2410"/>
    <ellipse cx="82" cy="102" rx="4" ry="3.5" fill="#1A0800"/>
    <ellipse cx="83.5" cy="100.5" rx="1.5" ry="1.5" fill="white"/>
  </g>
  <path d="M 70,108 Q 80,115 90,108" stroke="#B07050" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Right eye — happy squint -->
  <ellipse cx="120" cy="101" rx="10" ry="8" fill="white"/>
  <g clip-path="url(#eye-r-clip)">
    <ellipse cx="121" cy="103" rx="7" ry="6" fill="#4A2410"/>
    <ellipse cx="122" cy="102" rx="4" ry="3.5" fill="#1A0800"/>
    <ellipse cx="123.5" cy="100.5" rx="1.5" ry="1.5" fill="white"/>
  </g>
  <path d="M 110,108 Q 120,115 130,108" stroke="#B07050" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows — raised high -->
  <path d="M 68,79 Q 80,73 91,77" stroke="#1C0D05" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 109,77 Q 120,73 132,79" stroke="#1C0D05" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="95" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>
  <ellipse cx="105" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>

  <!-- Mouth — huge celebrating smile -->
  <path d="M 80,130 Q 100,152 120,130" stroke="#C4706A" stroke-width="2.5" fill="#C4706A"/>
  <path d="M 83,133 Q 100,150 117,133" fill="white" stroke="none"/>
  <line x1="91" y1="133" x2="91" y2="143" stroke="#C4706A" stroke-width="1"/>
  <line x1="100" y1="133" x2="100" y2="145" stroke="#C4706A" stroke-width="1"/>
  <line x1="109" y1="133" x2="109" y2="143" stroke="#C4706A" stroke-width="1"/>

  <!-- Neck -->
  <rect x="88" y="168" width="24" height="30" rx="4" fill="#C8956C"/>

  <!-- White shirt -->
  <path d="M 65,196 L 100,216 L 135,196 L 150,260 L 50,260 Z" fill="#F5F5F5"/>

  <!-- Blazer -->
  <path d="M 10,240 L 58,196 L 65,196 L 100,216 L 82,260 L 10,260 Z" fill="#A7C7E7"/>
  <path d="M 190,240 L 142,196 L 135,196 L 100,216 L 118,260 L 190,260 Z" fill="#A7C7E7"/>

  <!-- Lapels -->
  <path d="M 65,196 L 100,218 L 100,209 L 82,193 Z" fill="#D6E8F5"/>
  <path d="M 135,196 L 100,218 L 100,209 L 118,193 Z" fill="#D6E8F5"/>
</svg>
