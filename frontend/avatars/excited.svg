<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <clipPath id="eye-l-clip"><ellipse cx="80" cy="99" rx="11" ry="13"/></clipPath>
    <clipPath id="eye-r-clip"><ellipse cx="120" cy="99" rx="11" ry="13"/></clipPath>
  </defs>

  <!-- Hair back -->
  <ellipse cx="100" cy="86" rx="60" ry="76" fill="#1C0D05"/>
  <path d="M 42,100 C 30,125 26,152 32,178 C 36,196 48,216 62,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 158,100 C 170,125 174,152 168,178 C 164,196 152,216 138,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <ellipse cx="100" cy="110" rx="52" ry="62" fill="#C8956C"/>

  <!-- Extra blush for excitement -->
  <ellipse cx="68" cy="122" rx="17" ry="10" fill="#E8A898" opacity="0.65"/>
  <ellipse cx="132" cy="122" rx="17" ry="10" fill="#E8A898" opacity="0.65"/>

  <!-- Left eye — wide open -->
  <ellipse cx="80" cy="99" rx="11" ry="13" fill="white"/>
  <g clip-path="url(#eye-l-clip)">
    <ellipse cx="81" cy="100" rx="7.5" ry="9" fill="#4A2410"/>
    <ellipse cx="82" cy="99" rx="4.5" ry="5" fill="#1A0800"/>
    <ellipse cx="83.5" cy="97" rx="2" ry="2" fill="white"/>
  </g>

  <!-- Right eye — wide open -->
  <ellipse cx="120" cy="99" rx="11" ry="13" fill="white"/>
  <g clip-path="url(#eye-r-clip)">
    <ellipse cx="121" cy="100" rx="7.5" ry="9" fill="#4A2410"/>
    <ellipse cx="122" cy="99" rx="4.5" ry="5" fill="#1A0800"/>
    <ellipse cx="123.5" cy="97" rx="2" ry="2" fill="white"/>
  </g>

  <!-- Eyebrows — raised high -->
  <path d="M 68,80 Q 80,74 91,78" stroke="#1C0D05" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 109,78 Q 120,74 132,80" stroke="#1C0D05" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="95" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>
  <ellipse cx="105" cy="120" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>

  <!-- Mouth — open big smile with teeth -->
  <path d="M 81,131 Q 100,150 119,131" stroke="#C4706A" stroke-width="2" fill="#C4706A"/>
  <path d="M 83,133 Q 100,148 117,133" fill="white" stroke="none"/>
  <!-- Teeth line -->
  <line x1="91" y1="133" x2="91" y2="141" stroke="#C4706A" stroke-width="1"/>
  <line x1="100" y1="133" x2="100" y2="142" stroke="#C4706A" stroke-width="1"/>
  <line x1="109" y1="133" x2="109" y2="141" stroke="#C4706A" stroke-width="1"/>

  <!-- Neck -->
  <rect x="88" y="168" width="24" height="30" rx="4" fill="#C8956C"/>

  <!-- White shirt -->
  <path d="M 65,196 L 100,216 L 135,196 L 150,260 L 50,260 Z" fill="#F5F5F5"/>

  <!-- Blazer -->
  <path d="M 10,240 L 58,196 L 65,196 L 100,216 L 82,260 L 10,260 Z" fill="#A7C7E7"/>
  <path d="M 190,240 L 142,196 L 135,196 L 100,216 L 118,260 L 190,260 Z" fill="#A7C7E7"/>

  <!-- Lapels -->
  <path d="M 65,196 L 100,218 L 100,209 L 82,193 Z" fill="#D6E8F5"/>
  <path d="M 135,196 L 100,218 L 100,209 L 118,193 Z" fill="#D6E8F5"/>
</svg>
