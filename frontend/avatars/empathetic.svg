<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <clipPath id="eye-l-clip"><ellipse cx="80" cy="100" rx="10" ry="11"/></clipPath>
    <clipPath id="eye-r-clip"><ellipse cx="120" cy="100" rx="10" ry="11"/></clipPath>
  </defs>

  <!-- Hair back -->
  <ellipse cx="100" cy="86" rx="60" ry="76" fill="#1C0D05"/>
  <path d="M 42,100 C 30,125 26,152 32,178 C 36,196 48,216 62,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 158,100 C 170,125 174,152 168,178 C 164,196 152,216 138,232" stroke="#1C0D05" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- Face — very slightly tilted down (head tilt effect via transform) -->
  <ellipse cx="100" cy="112" rx="52" ry="62" fill="#C8956C"/>

  <!-- Softer blush -->
  <ellipse cx="72" cy="126" rx="14" ry="8" fill="#E8A898" opacity="0.35"/>
  <ellipse cx="128" cy="126" rx="14" ry="8" fill="#E8A898" opacity="0.35"/>

  <!-- Left eye — outer corner slightly lower (concerned) -->
  <ellipse cx="80" cy="101" rx="10" ry="10" fill="white"/>
  <g clip-path="url(#eye-l-clip)">
    <ellipse cx="81" cy="102" rx="7" ry="7.5" fill="#4A2410"/>
    <ellipse cx="82" cy="101" rx="4" ry="4" fill="#1A0800"/>
    <ellipse cx="83" cy="100" rx="1.5" ry="1.5" fill="white"/>
  </g>
  <!-- Outer corner droop -->
  <path d="M 88,107 Q 91,110 90,106" stroke="#C8956C" stroke-width="3" fill="none"/>

  <!-- Right eye -->
  <ellipse cx="120" cy="101" rx="10" ry="10" fill="white"/>
  <g clip-path="url(#eye-r-clip)">
    <ellipse cx="121" cy="102" rx="7" ry="7.5" fill="#4A2410"/>
    <ellipse cx="122" cy="101" rx="4" ry="4" fill="#1A0800"/>
    <ellipse cx="123" cy="100" rx="1.5" ry="1.5" fill="white"/>
  </g>
  <path d="M 112,107 Q 109,110 110,106" stroke="#C8956C" stroke-width="3" fill="none"/>

  <!-- Eyebrows — inner corners slightly raised (concerned expression) -->
  <path d="M 70,88 Q 80,84 90,87" stroke="#1C0D05" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M 110,87 Q 120,84 130,88" stroke="#1C0D05" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Inner brow raise -->
  <path d="M 88,85 Q 91,81 94,84" stroke="#1C0D05" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 106,84 Q 109,81 112,85" stroke="#1C0D05" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="95" cy="122" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>
  <ellipse cx="105" cy="122" rx="3" ry="2" fill="#9A6040" opacity="0.55"/>

  <!-- Mouth — gentle understanding smile -->
  <path d="M 87,135 Q 100,143 113,135" stroke="#C4706A" stroke-width="2.3" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="88" y="170" width="24" height="28" rx="4" fill="#C8956C"/>

  <!-- White shirt -->
  <path d="M 65,196 L 100,216 L 135,196 L 150,260 L 50,260 Z" fill="#F5F5F5"/>

  <!-- Blazer -->
  <path d="M 10,240 L 58,196 L 65,196 L 100,216 L 82,260 L 10,260 Z" fill="#A7C7E7"/>
  <path d="M 190,240 L 142,196 L 135,196 L 100,216 L 118,260 L 190,260 Z" fill="#A7C7E7"/>

  <!-- Lapels -->
  <path d="M 65,196 L 100,218 L 100,209 L 82,193 Z" fill="#D6E8F5"/>
  <path d="M 135,196 L 100,218 L 100,209 L 118,193 Z" fill="#D6E8F5"/>
</svg>
